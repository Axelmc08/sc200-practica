ax-width:100%}.slots{display:grid;gap:12px;margin-top:20px}.slot{display:grid;gap:9px;padding:16px;border:1px solid #d7dfeb;border-radius:10px}.slot label{font-weight:600}.slot select{width:100%;min-width:0;padding:12px;border:1px solid #c7d2e3;border-radius:7px;background:white}.slot.over{outline:3px solid #3767ed}.slot.correct{background:#edf9f1;border-color:#31845b}.slot.wrong{background:#fff1f2;border-color:#ca5b6c}.field-result{font-size:14px;overflow-wrap:anywhere}.field-result:empty{display:none}main{max-width:1240px}.pdf-tools{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;font-size:14px}.pdf-tools select{padding:9px;border:1px solid #c7d2e3;border-radius:7px}.pdf-page{margin:0 0 22px}.pdf-page figcaption{font-size:13px;color:#62718a;margin-bottom:8px}.pdf-page a{color:#244dba}.pdf-scroll{overflow:auto;border:1px solid #e0e6ef;border-radius:8px;background:white}.pdf-scroll img{display:block;width:100%;max-width:none;height:auto}.answer-title{font-size:20px;margin:28px 0 16px}.text-version .prompt{margin-top:18px}.option span:last-child{white-space:pre-wrap;overflow-wrap:anywhere}.image-load-note{font-size:14px;padding:14px;color:#60708b}.image-load-note button{padding:7px 12px;margin-left:8px}img[data-pdf-page]{aspect-ratio:1488/837;object-fit:contain}</style></head><body><header><div class="brand"><span>SC-200</span>Práctica de examen</div><div class="header-label">Microsoft Security Operations Analyst</div></header><main><nav aria-label="Recursos de estudio" style="margin-bottom:22px"><a href="conocimientos.html" style="display:inline-block;background:#143c59;color:white;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700">Base de conocimientos SC-200</a></nav><div class="top"><div><h1>Una pregunta a la vez.</h1><div class="muted" id="count">Preparando preguntas…</div></div><form class="goto" id="jump"><label for="number">Ir a pregunta</label><input id="number" type="number" min="1" value="1" required><button type="submit">Ir</button></form></div><div class="track" role="progressbar" aria-label="Posición en el cuestionario" aria-valuemin="1" id="progress"><div id="fill"></div></div><section class="card" aria-label="Pregunta de práctica" id="card"><div class="empty">Cargando el cuestionario…</div></section><nav class="navigation" aria-label="Navegación de preguntas"><button id="prev">Anterior</button><span class="muted" id="position"></span><button id="next">Siguiente</button></nav><p class="footnote">Todas las preguntas son verificables. Las respuestas siguen la clave del PDF proporcionado, incluida su traducción original.</p></main><script id="question-data" type="application/json">[{"id": 1, "sourceNumber": 1, "prompt": "Tienes la siguiente consulta de búsqueda avanzada en Microsoft 365 Defender.\nDebes recibir una alerta cuando algún proceso desactive la función Restaurar sistema en un dispositivo administrado por Microsoft\nDefender durante las últimas 24 horas.\n¿Cuáles dos acciones debes realizar? Cada respuesta correcta presenta parte de la solución.\nNOTA: Cada selección correcta vale un punto.", "options": [{"id": "A", "text": "Crear una regla de detección."}, {"id": "B", "text": "Crear una regla de supresión."}, {"id": "C", "text": "Agregue | ordenar por marca de tiempo a la consulta."}, {"id": "D", "text": "Reemplace DeviceProcessEvents con DeviceNetworkEvents."}, {"id": "E", "text": "Agregue DeviceId y ReportId al resultado de la consulta."}], "answer": ["A", "E"], "questionPages": [60], "answerPages": [61], "page": 60, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Crear una regla de detección."}, {"id": "B", "text": "Crear una regla de supresión."}, {"id": "C", "text": "Agregue | ordenar por marca de tiempo a la consulta."}, {"id": "D", "text": "Reemplace DeviceProcessEvents con DeviceNetworkEvents."}, {"id": "E", "text": "Agregue DeviceId y ReportId al resultado de la consulta."}], "answer": ["A", "E"]}}, {"id": 2, "sourceNumber": 2, "prompt": "Estás investigando un posible ataque que despliega una nueva variante de ransomware.\nTienes tres grupos de dispositivos personalizados. Estos grupos contienen dispositivos que almacenan información altamente sensible.\nPlaneas realizar acciones automatizadas en todos los dispositivos.\nNecesitas poder agrupar temporalmente las máquinas para realizar acciones en los dispositivos.\n¿Cuáles tres acciones debes realizar? Cada respuesta correcta presenta parte de la solución.\nNOTA: Cada selección correcta vale un punto.", "options": [{"id": "A", "text": "Asignar una etiqueta al grupo de dispositivos."}, {"id": "B", "text": "Agregar los usuarios del dispositivo al rol de administrador."}, {"id": "C", "text": "Agregar una etiqueta a las máquinas."}, {"id": "D", "text": "Crear un nuevo grupo de dispositivos con rango 1."}, {"id": "E", "text": "Crear un nuevo rol\nde administrador."}, {"id": "F", "text": "Cree un nuevo grupo de dispositivos con rango 4."}], "answer": ["A", "C", "D"], "questionPages": [62], "answerPages": [63], "page": 62, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Asignar una etiqueta al grupo de dispositivos."}, {"id": "B", "text": "Agregar los usuarios del dispositivo al rol de administrador."}, {"id": "C", "text": "Agregar una etiqueta a las máquinas."}, {"id": "D", "text": "Crear un nuevo grupo de dispositivos con rango 1."}, {"id": "E", "text": "Crear un nuevo rol\nde administrador."}, {"id": "F", "text": "Cree un nuevo grupo de dispositivos con rango 4."}], "answer": ["A", "C", "D"]}}, {"id": 3, "sourceNumber": 3, "prompt": "Está configurando Microsoft Defender para la integración de identidades con Active Directory.\nDesde el portal de identidades de Microsoft Defender, es necesario configurar varias cuentas para que los atacantes puedan explotarlas.\nSolución: Desde las etiquetas de entidad, agregue las cuentas como cuentas de Honeytoken.\n¿Esto cumple el objetivo?", "options": [{"id": "A", "text": "Sí"}, {"id": "B", "text": "No"}], "answer": ["A"], "questionPages": [64], "answerPages": [65], "page": 64, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Sí"}, {"id": "B", "text": "No"}], "answer": ["A"]}}, {"id": 4, "sourceNumber": 4, "prompt": "Debe recibir una alerta de seguridad cuando un usuario intente iniciar sesión desde una ubicación que nunca haya sido utilizada por los demás\nusuarios de su organización para iniciar sesión.\n¿Qué política de detección de anomalías debería utilizar?", "options": [{"id": "A", "text": "Viajes imposibles"}, {"id": "B", "text": "Actividad desde direcciones IP anónimas"}, {"id": "C", "text": "Actividad desde un país poco frecuente"}, {"id": "D", "text": "Detección de malware"}], "answer": ["C"], "questionPages": [66], "answerPages": [67], "page": 66, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Viajes imposibles"}, {"id": "B", "text": "Actividad desde direcciones IP anónimas"}, {"id": "C", "text": "Actividad desde un país poco frecuente"}, {"id": "D", "text": "Detección de malware"}], "answer": ["C"]}}, {"id": 5, "sourceNumber": 5, "prompt": "Implementa las directivas de Archivos adjuntos seguros en Microsoft Defender para Office 365.\nLos usuarios informan que los correos electrónicos con archivos adjuntos tardan más de lo esperado en recibirse.\nEs necesario reducir el tiempo de entrega de los mensajes con archivos adjuntos sin comprometer la seguridad. Los archivos adjuntos deben\nanalizarse en busca de malware y los mensajes que lo contengan deben bloquearse.\n¿Qué debería configurar en las políticas de Archivos adjuntos seguros?", "options": [{"id": "A", "text": "Entrega dinámica"}, {"id": "B", "text": "Reemplazar"}, {"id": "C", "text": "Bloquear y habilitar la redirección"}, {"id": "D", "text": "Monitorear y habilitar la redirección"}], "answer": ["A"], "questionPages": [68], "answerPages": [69], "page": 68, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Entrega dinámica"}, {"id": "B", "text": "Reemplazar"}, {"id": "C", "text": "Bloquear y habilitar la redirección"}, {"id": "D", "text": "Monitorear y habilitar la redirección"}], "answer": ["A"]}}, {"id": 6, "sourceNumber": 6, "prompt": "Está investigando un incidente utilizando Microsoft 365 Defender. (Caso práctico 3)\nNecesitas crear una consulta de búsqueda avanzada para contar los intentos fallidos de autenticación de inicio de sesión en tres dispositivos llamados\nCFOLaptop, CEOLaptop y COOLaptop.\n¿Cómo debe completar la consulta? Para responder, seleccione las opciones adecuadas en el área de respuesta.\nNOTA: Cada selección correcta vale un punto.\nSeleccionar y colocar:", "options": [], "answer": [], "questionPages": [70], "answerPages": [71], "page": 70, "hasVisual": false, "interaction": {"type": "order", "slots": [{"label": "Paso 1", "choices": ["DeviceEvents", "| project LogonFailures=count()", "| where ActionType == FailureReason", "ActionType == \"LogonFailed\"", "DeviceLogonEvents", "| where DeviceName in (\"CFOLaptop\", \"CEOLaptop\", \"COOLaptop\")", "ActionType == FailureReason", "| summarize LogonFailures=count() by DeviceName, LogonType"], "correct": "DeviceLogonEvents"}, {"label": "Paso 2", "choices": ["DeviceEvents", "| project LogonFailures=count()", "| where ActionType == FailureReason", "ActionType == \"LogonFailed\"", "DeviceLogonEvents", "| where DeviceName in (\"CFOLaptop\", \"CEOLaptop\", \"COOLaptop\")", "ActionType == FailureReason", "| summarize LogonFailures=count() by DeviceName, LogonType"], "correct": "| where DeviceName in (\"CFOLaptop\", \"CEOLaptop\", \"COOLaptop\")"}, {"label": "Paso 3", "choices": ["DeviceEvents", "| project LogonFailures=count()", "| where ActionType == FailureReason", "ActionType == \"LogonFailed\"", "DeviceLogonEvents", "| where DeviceName in (\"CFOLaptop\", \"CEOLaptop\", \"COOLaptop\")", "ActionType == FailureReason", "| summarize LogonFailures=count() by DeviceName, LogonType"], "correct": "ActionType == FailureReason"}, {"label": "Paso 4", "choices": ["DeviceEvents", "| project LogonFailures=count()", "| where ActionType == FailureReason", "ActionType == \"LogonFailed\"", "DeviceLogonEvents", "| where DeviceName in (\"CFOLaptop\", \"CEOLaptop\", \"COOLaptop\")", "ActionType == FailureReason", "| summarize LogonFailures=count() by DeviceName, LogonType"], "correct": "| summarize LogonFailures=count() by DeviceName, LogonType"}]}, "adaptedVisual": true}, {"id": 7, "sourceNumber": 7, "prompt": "Se le informa de un aumento en la cantidad de correos electrónicos maliciosos que reciben los usuarios.\nDebes crear una consulta de búsqueda avanzada en Microsoft 365 Defender para identificar si las cuentas de los destinatarios del correo electrónico se vieron comprometidas.\nLa consulta debe devolver los 20 inicios de sesión más recientes realizados por los destinatarios en la hora posterior a la recepción del correo electrónico malicioso conocido.\n¿Cómo debe completar la consulta? Para responder, seleccione las opciones adecuadas en el área de respuesta.\nNOTA: Cada selección correcta vale un punto.", "options": [], "answer": [], "questionPages": [72], "answerPages": [73], "page": 72, "hasVisual": false, "interaction": {"type": "fill", "slots": [{"label": "Selección 1 (de arriba abajo)", "choices": ["EmailAttachmentInfo", "select 20", "top 20", "EmailEvents", "IdentityLogonEvents", "take 20"], "correct": "EmailEvents"}, {"label": "Selección 2 (de arriba abajo)", "choices": ["EmailAttachmentInfo", "select 20", "top 20", "EmailEvents", "IdentityLogonEvents", "take 20"], "correct": "IdentityLogonEvents"}, {"label": "Selección 3 (de arriba abajo)", "choices": ["EmailAttachmentInfo", "select 20", "top 20", "EmailEvents", "IdentityLogonEvents", "take 20"], "correct": "take 20"}]}, "adaptedVisual": true}, {"id": 8, "sourceNumber": 8, "prompt": "Recibe un boletín de seguridad sobre un posible ataque que utiliza un archivo de imagen.\nPara prevenir el ataque, debe crear un indicador de compromiso (IoC) en Microsoft Defender for Endpoint.\n¿Qué tipo de indicador debería utilizar?", "options": [{"id": "A", "text": "un indicador de URL/dominio con la acción configurada en Alerta\nsolamente"}, {"id": "B", "text": "un indicador de URL/dominio con la acción configurada en Alerta y\nbloqueo"}, {"id": "C", "text": "un indicador de hash de archivo con la acción configurada en Alerta y bloqueo"}, {"id": "D", "text": "un indicador de certificado con la acción configurada en Alerta y bloqueo"}], "answer": ["C"], "questionPages": [74], "answerPages": [75], "page": 74, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "un indicador de URL/dominio con la acción configurada en Alerta\nsolamente"}, {"id": "B", "text": "un indicador de URL/dominio con la acción configurada en Alerta y\nbloqueo"}, {"id": "C", "text": "un indicador de hash de archivo con la acción configurada en Alerta y bloqueo"}, {"id": "D", "text": "un indicador de certificado con la acción configurada en Alerta y bloqueo"}], "answer": ["C"]}}, {"id": 9, "sourceNumber": 9, "prompt": "Su empresa implementa los siguientes servicios:\n\u0000 Microsoft Defender para identidad\n\u0000 Microsoft Defender para endpoints\n\u0000 Microsoft Defender para Office 365\nDebe proporcionar a un analista de seguridad la capacidad de usar el Centro de seguridad de Microsoft 365. El analista debe poder aprobar y\nrechazar las acciones pendientes generadas por Microsoft Defender para Endpoint. La solución debe aplicar el principio de mínimo\nprivilegio.\n¿Qué dos funciones se le deben asignar al analista? Cada respuesta correcta presenta parte de la solución.\nNOTA: Cada selección correcta vale un punto.", "options": [{"id": "A", "text": "El administrador de datos de cumplimiento en Azure Active Directory\n(Azure AD)"}, {"id": "B", "text": "La función de acciones de remediación activas en Microsoft Defender\npara Endpoint"}, {"id": "C", "text": "El rol de Administrador de seguridad en Azure Active Directory\n(Azure AD)"}, {"id": "D", "text": "El rol de Lector de seguridad en Azure Active Directory (Azure AD)"}], "answer": ["B", "D"], "questionPages": [76], "answerPages": [77], "page": 76, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "El administrador de datos de cumplimiento en Azure Active Directory\n(Azure AD)"}, {"id": "B", "text": "La función de acciones de remediación activas en Microsoft Defender\npara Endpoint"}, {"id": "C", "text": "El rol de Administrador de seguridad en Azure Active Directory\n(Azure AD)"}, {"id": "D", "text": "El rol de Lector de seguridad en Azure Active Directory (Azure AD)"}], "answer": ["B", "D"]}}, {"id": 10, "sourceNumber": 10, "prompt": "Tienes una suscripción a Microsoft 365 E5 que utiliza Microsoft Defender y una suscripción a Azure que utiliza Azure Sentinel.\nDebes identificar todos los dispositivos que contienen archivos en correos electrónicos enviados por un remitente malicioso conocido. La consulta se\nbasará en la coincidencia del hash SHA256.\n¿Cómo debe completar la consulta? Para responder, seleccione las opciones adecuadas en el área de respuesta.\nNOTA: Cada selección correcta vale un punto.", "options": [], "answer": [], "questionPages": [78], "answerPages": [79], "page": 78, "hasVisual": false, "interaction": {"type": "fill", "slots": [{"label": "Selección 1 (de arriba abajo)", "choices": ["DeviceId", "RecipientEmailAddress", "SenderFromAddress", "SHA256"], "correct": "SHA256"}, {"label": "Selección 2 (de arriba abajo)", "choices": ["DeviceId", "RecipientEmailAddress", "SenderFromAddress", "SHA256"], "correct": "SHA256"}]}, "adaptedVisual": true}, {"id": 11, "sourceNumber": 11, "prompt": "Debe configurar Microsoft Cloud App Security para que genere alertas y active acciones correctivas en respuesta al uso compartido externo de archivos confidenciales.\n¿Qué dos acc ct", "make-series", "range", "summarize", "bin"], "correct": "summarize"}, {"label": "Selección 2 (de arriba abajo)", "choices": ["lookup", "project", "make-series", "range", "summarize", "bin"], "correct": "bin"}]}, "adaptedVisual": true}, {"id": 418, "sourceNumber": 418, "prompt": "PUNTO DE INTERÉS (No se admite arrastrar y soltar)\nTienes cuatro suscripciones de Azure. Una de ellas contiene un espacio de trabajo de Microsoft Sentinel.\nNecesita implementar conectores de datos de Microsoft Sentinel para recopilar datos de las suscripciones mediante Azure Policy. La\nsolución debe garantizar que la directiva se aplique a los recursos nuevos y existentes en las suscripciones.\n¿Qué tipo de conectores debería configurar y qué debería usar para garantizar la monitorización de todos los recursos? Para responder,\nseleccione las opciones adecuadas en el área de respuesta.\nNOTA: Cada selección correcta vale un punto.\nZona caliente:", "options": [], "answer": [], "questionPages": [988], "answerPages": [989, 990, 991], "page": 988, "hasVisual": false, "interaction": {"type": "fill", "slots": [{"label": "Selección 1 (de arriba abajo)", "choices": ["API-based", "Log Analytics agent-based", "A workbook", "An analytics rule", "Diagnostic settings", "A remediation task"], "correct": "Diagnostic settings"}, {"label": "Selección 2 (de arriba abajo)", "choices": ["API-based", "Log Analytics agent-based", "A workbook", "An analytics rule", "Diagnostic settings", "A remediation task"], "correct": "A remediation task"}]}, "adaptedVisual": true}, {"id": 419, "sourceNumber": 419, "prompt": "Tienes 50 espacios de trabajo de Microsoft Sentinel. (Caso de estudio 11)\nNecesitas visualizar todos los incidentes de todos los espacios de trabajo en una sola página del portal de Azure. La solución debe minimizar el esfuerzo\nadministrativo.\n¿Qué página debería usar en el portal de Azure?", "options": [{"id": "A", "text": "Microsoft Sentinel ­ Incidentes"}, {"id": "B", "text": "Microsoft Sentinel ­ Libros de trabajo"}, {"id": "C", "text": "Microsoft Sentinel\nEspacios de trabajo de"}, {"id": "D", "text": "Log Analytics"}], "answer": ["A"], "questionPages": [992], "answerPages": [993], "page": 992, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Microsoft Sentinel ­ Incidentes"}, {"id": "B", "text": "Microsoft Sentinel ­ Libros de trabajo"}, {"id": "C", "text": "Microsoft Sentinel\nEspacios de trabajo de"}, {"id": "D", "text": "Log Analytics"}], "answer": ["A"]}}, {"id": 420, "sourceNumber": 420, "prompt": "Tienes una suscripción a Microsoft 365 que utiliza Microsoft Defender XDR.\nTienes una consulta que contiene las siguientes instrucciones.\nDebes configurar una regla de detección personalizada que utilice la consulta. La solución debe minimizar el tiempo de espera para\nrecibir notificaciones sobre eventos que coincidan con la consulta.\n¿Qué frecuencia debería seleccionar para la regla?", "options": [{"id": "A", "text": "Cada 3 horas"}, {"id": "B", "text": "Cada hora"}, {"id": "C", "text": "Cada 12 horas"}, {"id": "D", "text": "Continuo (NRT)"}], "answer": ["D"], "questionPages": [994], "answerPages": [995], "page": 994, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Cada 3 horas"}, {"id": "B", "text": "Cada hora"}, {"id": "C", "text": "Cada 12 horas"}, {"id": "D", "text": "Continuo (NRT)"}], "answer": ["D"]}}, {"id": 421, "sourceNumber": 421, "prompt": "Tienes un espacio de trabajo de Microsoft Sentinel.\nDebe configurar la regla de análisis de Fusion para suprimir temporalmente los incidentes generados por un conector de Microsoft\nDefender. La solución debe cumplir los siguientes requisitos:\n• Minimizar el impacto en la capacidad de detectar ataques multietapa.\n• Minimizar el esfuerzo administrativo.\n¿Cómo se debe configurar la regla? Para responder, seleccione las opciones adecuadas en el área de respuesta.\nNOTA: Cada selección correcta vale un punto.", "options": [], "answer": [], "questionPages": [996], "answerPages": [997], "page": 996, "hasVisual": false, "interaction": {"type": "fill", "slots": [{"label": "Selección 1 (de arriba abajo)", "choices": ["When alert is created", "When incident is created", "Add task", "Change status", "When incident is updated", "Run playbook"], "correct": "When incident is updated"}, {"label": "Selección 2 (de arriba abajo)", "choices": ["When alert is created", "When incident is created", "Add task", "Change status", "When incident is updated", "Run playbook"], "correct": "Run playbook"}]}, "adaptedVisual": true}, {"id": 422, "sourceNumber": 422, "prompt": "Tiene una suscripción a Microsoft 365 que contiene tres usuarios llamados Usuario1, Usuario2 y Usuario3 y los recursos que se\nmuestran en la siguiente tabla.\nTienes una regla de detección de Microsoft Defender XDR llamada Rule1 que tiene las siguientes configuraciones: * Ámbito: DevGroup1\n* Hash de archivo:\nFile1.exe * Acciones o\nDispositivos:\nRecopilar paquete de investigación o Usuario: Marcar\ncomo comprometido o Archivos: Bloquear Cada usuario\nintenta ejecutar File1.exe en su dispositivo.\nPara cada una de las siguientes afirmaciones, seleccione Sí si la afirmación es verdadera. De lo contrario, seleccione No.\nNOTA: Cada selección correcta vale un punto.", "options": [], "answer": [], "questionPages": [998], "answerPages": [999, 1000], "page": 998, "hasVisual": false, "interaction": {"type": "boolean", "slots": [{"label": "File1.exe will be blocked on Device3.", "choices": ["Sí", "No"], "correct": "No"}, {"label": "User2 will be marked with a risk level of medium.", "choices": ["Sí", "No"], "correct": "No"}, {"label": "An investigation package will be collected from Device1.", "choices": ["Sí", "No"], "correct": "Sí"}]}, "adaptedVisual": true}, {"id": 423, "sourceNumber": 423, "prompt": "Tiene una suscripción a Microsoft 365 E5 que utiliza Microsoft Defender XDR y contiene un usuario llamado User1.\nDebe asegurarse de que el Usuario1 pueda administrar las reglas de detección personalizadas de Microsoft Defender XDR y las directivas de seguridad de punto final.\nLa solución debe seguir el principio del mínimo privilegio.\n¿Qué rol deberías asignar al Usuario1?", "options": [{"id": "A", "text": "Administrador de seguridad"}, {"id": "B", "text": "Operador de seguridad"}, {"id": "C", "text": "Administrador de dispositivos en la nube"}, {"id": "D", "text": "Administrador de análisis de escritorio"}], "answer": ["A"], "questionPages": [1001], "answerPages": [1002], "page": 1001, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Administrador de seguridad"}, {"id": "B", "text": "Operador de seguridad"}, {"id": "C", "text": "Administrador de dispositivos en la nube"}, {"id": "D", "text": "Administrador de análisis de escritorio"}], "answer": ["A"]}}, {"id": 424, "sourceNumber": 424, "prompt": "Tienes una suscripción a Microsoft 365 E5 que utiliza Microsoft Defender XDR.\nTienes una regla de detección personalizada llamada Rule1 que genera una alerta si se detectan más de cinco detecciones de antivirus en un\ndispositivo. Rule1 tiene un período de bucle de 12 horas.\nDebes cambiar el período de bucle a 48 horas.\n¿Qué deberías modificar para la Regla 1?", "options": [{"id": "A", "text": "la frecuencia"}, {"id": "B", "text": "el alcance"}, {"id": "C", "text": "el operador summarize de la consulta KQL"}, {"id": "D", "text": "el\noperador where de la consulta KQL"}], "answer": ["A"], "questionPages": [1003], "answerPages": [1004], "page": 1003, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "la frecuencia"}, {"id": "B", "text": "el alcance"}, {"id": "C", "text": "el operador summarize de la consulta KQL"}, {"id": "D", "text": "el\noperador where de la consulta KQL"}], "answer": ["A"]}}, {"id": 425, "sourceNumber": 425, "prompt": "Usted utiliza Azure Sentinel.\nEs necesario utilizar un rol integrado para otorgar a un analis  contents of the ZIP file."], "correct": "Navigate to the device page for Device1."}, {"label": "Paso 3", "choices": ["Initiate a live response session.", "Navigate to the device page for Device1.", "Collect an investigation package.", "Extract the contents of the ZIP file."], "correct": "Collect an investigation package."}, {"label": "Paso 4", "choices": ["Initiate a live response session.", "Navigate to the device page for Device1.", "Collect an investigation package.", "Extract the contents of the ZIP file."], "correct": "Extract the contents of the ZIP file."}]}, "adaptedVisual": true}, {"id": 427, "sourceNumber": 427, "prompt": "Tiene una suscripción de Azure que contiene un espacio de trabajo de Microsoft Sentinel llamado WS1. WS1 tiene configurados el\nconector de actividad de Azure y el conector de ID de Microsoft Entra.\nDebes investigar qué cuentas tienen la mayor cantidad de alertas y cualquier información de incidentes correspondiente para cada alerta.\nLa solución debe minimizar el esfuerzo administrativo. ¿Qué debería hacer primero en WS1?", "options": [{"id": "A", "text": "Desde el centro de contenido, instale Cloud Identity Threat Protection Essentials."}, {"id": "B", "text": "Habilitar el análisis del comportamiento de usuarios y entidades (UEBA)."}, {"id": "C", "text": "Desde el centro de contenido, instale la solución de gestión de riesgos internos Microsoft Purview."}, {"id": "D", "text": "Utilice el análisis del comportamiento de usuarios y entidades (UEBA) para detectar anomalías."}], "answer": ["B"], "questionPages": [1009], "answerPages": [1010], "page": 1009, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Desde el centro de contenido, instale Cloud Identity Threat Protection Essentials."}, {"id": "B", "text": "Habilitar el análisis del comportamiento de usuarios y entidades (UEBA)."}, {"id": "C", "text": "Desde el centro de contenido, instale la solución de gestión de riesgos internos Microsoft Purview."}, {"id": "D", "text": "Utilice el análisis del comportamiento de usuarios y entidades (UEBA) para detectar anomalías."}], "answer": ["B"]}}, {"id": 428, "sourceNumber": 428, "prompt": "Está configurando Microsoft Cloud App Security.\nUsted dispone de una política de detección de amenazas personalizada basada en los rangos de direcciones IP de las oficinas de su empresa ubicadas en Estados Unidos.\nRecibes muchas alertas relacionadas con viajes imposibles e inicios de sesión desde direcciones IP de riesgo.\nUsted determina que el 99% de las alertas son inicios de sesión legítimos desde sus oficinas corporativas.\nDebes evitar las alertas de inicio de sesión legítimo desde ubicaciones conocidas.\n¿Cuáles dos acciones debes realizar? Cada respuesta correcta presenta parte de la solución.\nNOTA: Cada selección correcta vale un punto.", "options": [{"id": "A", "text": "Agregue las direcciones IP a la categoría de otro rango de direcciones y agregue una etiqueta."}, {"id": "B", "text": "Aumentar el nivel de sensibilidad de la política de detección de anomalías de viajes imposibles."}, {"id": "C", "text": "Agregue las direcciones IP a la categoría de rango de direcciones corporativas."}, {"id": "D", "text": "Anular el enriquecimiento automático de datos."}, {"id": "E", "text": "Cree una política de actividad que excluya las direcciones IP."}], "answer": ["C", "D"], "questionPages": [1011], "answerPages": [1012], "page": 1011, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Agregue las direcciones IP a la categoría de otro rango de direcciones y agregue una etiqueta."}, {"id": "B", "text": "Aumentar el nivel de sensibilidad de la política de detección de anomalías de viajes imposibles."}, {"id": "C", "text": "Agregue las direcciones IP a la categoría de rango de direcciones corporativas."}, {"id": "D", "text": "Anular el enriquecimiento automático de datos."}, {"id": "E", "text": "Cree una política de actividad que excluya las direcciones IP."}], "answer": ["C", "D"]}}, {"id": 429, "sourceNumber": 429, "prompt": "Tiene una suscripción a Microsoft 365 B5 que contiene un usuario llamado User1. La suscripción utiliza Microsoft 365 Copilot\npara seguridad. Copilot para seguridad utiliza el complemento Sentinel. A User1 se le ha asignado el rol de Colaborador de Copilot.\nDurante una investigación, el Usuario1 envía una solicitud y recibe una notificación de que Copilot for Security no puede responder a las peticiones porque el uso de la\nunidad de cómputo de seguridad (SCU) se está acercando al límite de capacidad aprovisionada.\nDebes asegurarte de que el Usuario1 pueda usar Copilot para la seguridad para generar una respuesta correcta.\n¿Qué debería hacer el Usuario1?", "options": [{"id": "A", "text": "Abra una segunda sesión de Copilot for Security y envíe la solicitud."}, {"id": "B", "text": "Actualizar las SCU aprovisionadas."}, {"id": "C", "text": "Ejecute el libro de trabajo de optimización de Microsoft Sentinel."}, {"id": "D", "text": "Espere una hora y vuelva a enviar la solicitud."}], "answer": ["B"], "questionPages": [1013], "answerPages": [1014], "page": 1013, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Abra una segunda sesión de Copilot for Security y envíe la solicitud."}, {"id": "B", "text": "Actualizar las SCU aprovisionadas."}, {"id": "C", "text": "Ejecute el libro de trabajo de optimización de Microsoft Sentinel."}, {"id": "D", "text": "Espere una hora y vuelva a enviar la solicitud."}], "answer": ["B"]}}, {"id": 430, "sourceNumber": 430, "prompt": "Tiene una suscripción a Microsoft 365 que utiliza Microsoft Defender XDR, Microsoft Purview y Exchange Online.\nUsted tiene una empresa asociada llamada Contoso, Ltd.\nDebes revisar todos los correos electrónicos que contienen archivos PDF adjuntos y que recibiste de Contoso durante el último mes.\nLa solución debe minimizar el esfuerzo administrativo.\n¿Qué deberías usar?", "options": [{"id" ntication", "SrcGeoCountry"], "correct": "imAuthentication"}, {"label": "Selección 2 (de arriba abajo)", "choices": ["imNetworkSession", "imProcessCreate", "imWebSession", "SrcGeoRegion", "DstGeoCountry", "imAuthentication", "SrcGeoCountry"], "correct": "SrcGeoCountry"}]}, "adaptedVisual": true}, {"id": 466, "sourceNumber": 466, "prompt": "Tiene una suscripción a Microsoft 365 que utiliza Microsoft Defender XDR. Todos los equipos cliente ejecutan Windows 11 y están\nintegrados en Microsoft Defender para Endpoint.\nUsted dispone de una suscripción a Azure que contiene un espacio de trabajo de Microsoft Sentinel.\nDebe asegurarse de que, cuando se detecte malware en un equipo con Windows 11, se recopile un informe de análisis. La\nsolución debe minimizar el esfuerzo administrativo.\n¿Qué deberías configurar?", "options": [{"id": "A", "text": "una regla de automatización"}, {"id": "B", "text": "una política de seguridad de endpoint"}, {"id": "C", "text": "una regla de detección\npersonalizada"}, {"id": "D", "text": "una respuesta de alerta automatizada en Defender for Endpoint"}], "answer": ["D"], "questionPages": [1094], "answerPages": [1095], "page": 1094, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "una regla de automatización"}, {"id": "B", "text": "una política de seguridad de endpoint"}, {"id": "C", "text": "una regla de detección\npersonalizada"}, {"id": "D", "text": "una respuesta de alerta automatizada en Defender for Endpoint"}], "answer": ["D"]}}, {"id": 467, "sourceNumber": 467, "prompt": "Tiene una suscripción de Azure llamada Sub1 y una suscripción de Microsoft 365. Sub1 está vinculada a un\ninquilino de Azure Active Directory (Azure AD) llamado contoso.com.\nCrea un espacio de trabajo de Azure Sentinel llamado workspace1. En workspace1, activa un conector de Azure AD\npara contoso.com y un conector de Office 365 para la suscripción a Microsoft 365.\nDebe utilizar la regla Fusion para detectar ataques en varias etapas que incluyan inicios de sesión sospechosos en\ncontoso.com seguidos de actividad anómala en Microsoft Office 365.\n¿Cuáles dos acciones debes realizar? Cada respuesta correcta presenta parte de la solución.\nNOTA: Cada selección correcta vale un punto.", "options": [{"id": "A", "text": "Cree una regla de creación de incidentes de Microsoft basada en Azure Security Center."}, {"id": "B", "text": "Cree un conector de Microsoft Cloud App Security."}, {"id": "C", "text": "Cree una regla personalizada basada en las plantillas del conector de Office 365."}, {"id": "D", "text": "Cree un conector de Azure AD Identity Protection."}], "answer": ["B", "D"], "questionPages": [1096], "answerPages": [1097], "page": 1096, "hasVisual": false, "interaction": {"type": "choice", "options": [{"id": "A", "text": "Cree una regla de creación de incidentes de Microsoft basada en Azure Security Center."}, {"id": "B", "text": "Cree un conector de Microsoft Cloud App Security."}, {"id": "C", "text": "Cree una regla personalizada basada en las plantillas del conector de Office 365."}, {"id": "D", "text": "Cree un conector de Azure AD Identity Protection."}], "answer": ["B", "D"]}}]</script><script>const pdfBundles=new Map(),pdfURLs=new Map();
async function getPDFBundle(bucket){
 if(pdfBundles.has(bucket))return pdfBundles.get(bucket);
 const request=(async()=>{
  let failure;
  for(let attempt=0;attempt<3;attempt++){
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
   try{const response=await fetch('pdf-'+bucket+'.json',{signal:controller.signal});if(!response.ok)throw Error('HTTP '+response.status);return await response.json();}
   catch(error){failure=error;}finally{clearTimeout(timer);}
  }
  throw failure;
 })();
 pdfBundles.set(bucket,request);
 while(pdfBundles.size>2)pdfBundles.delete(pdfBundles.keys().next().value);
 request.catch(()=>{if(pdfBundles.get(bucket)===request)pdfBundles.delete(bucket);});
 return request;
}
function hydratePDFImages(){
 document.querySelectorAll('img[data-pdf-page]:not([data-loading])').forEach(async img=>{
  img.dataset.loading='true';const p=Number(img.dataset.pdfPage);
  let note=document.createElement('div');note.className='image-load-note';note.textContent='Cargando página '+p+'…';img.before(note);
  try{
   const data=await getPDFBundle(Math.floor((p-1)/10));if(!img.isConnected)return;
   if(!data[p])throw Error('Página no disponible');
   if(!pdfURLs.has(p)){const blob=await(await fetch(data[p])).blob();if(!img.isConnected)return;pdfURLs.set(p,URL.createObjectURL(blob));}
   const url=pdfURLs.get(p);img.onload=()=>note.remove();img.onerror=()=>{note.textContent='No se pudo mostrar esta imagen.';};img.src=url;
   const link=img.closest('.pdf-page')?.querySelector('a');if(link)link.href=url;
   while(pdfURLs.size>30){const oldest=pdfURLs.keys().next().value;URL.revokeObjectURL(pdfURLs.get(oldest));pdfURLs.delete(oldest);}
  }catch(error){
   if(!img.isConnected)return;
   note.textContent='No se pudo cargar la página '+p+'. ';
   const retry=document.createElement('button');retry.type='button';retry.textContent='Reintentar imagen';
   retry.onclick=()=>{note.remove();delete img.dataset.loading;hydratePDFImages();};note.append(retry);
   img.alt='Imagen pendiente de carga. Puedes reintentar o consultar la versión de texto.';
  }
 });
}
new MutationObserver(hydratePDFImages).observe(document.getElementById('card'),{childList:true,subtree:true});
document.getElementById('card').addEventListener('click',event=>{
 if(!event.target.closest('.pdf-zoom-open'))return;
 const zoom=document.getElementById('pdf-zoom');zoom.value='300';zoom.dispatchEvent(new Event('change'));
 event.target.closest('.pdf-page').scrollIntoView({block:'start',behavior:'smooth'});
});
</script><script>let questions=JSON.parse(document.getElementById('question-data').textContent),index=0;
const states=new Map(),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>questions[index];
function state(){if(!states.has(index))states.set(index,{selected:[],mode:null});return states.get(index)}
function expected(q){return q.interaction.type==='choice'?q.interaction.answer:q.interaction.slots.map(x=>x.correct)}
function grade(q,selected){const spec=q.interaction;if(spec.type==='choice')return selected.length===spec.answer.length&&spec.answer.every(x=>selected.includes(x));return [expected(q),...(spec.alternatives||[])].some(a=>a.length===selected.length&&a.every((x,i)=>x===selected[i]))}
function imagePages(pages){return pages.map(p=>`<div class="page-caption">Página ${p} del PDF</div><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-pdf-page="${p}" alt="Página ${p} del PDF" loading="lazy">`).join('')}
function originalPages(pages){return pages.map(p=>`<figure class="pdf-page"><figcaption>Página ${p} del PDF · <button type="button" class="pdf-zoom-open">Ampliar imagen</button></figcaption><div class="pdf-scroll"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-pdf-page="${p}" alt="Enunciado original de la página ${p}, con su código, tablas y opciones" loading="lazy"></div></figure>`).join('')}
function choices(slot){return [...slot.choices].sort((a,b)=>a.localeCompare(b))}
function render(){const q=current(),s=state(),spec=q.interaction,choice=spec.type==='choice',drag=['order','matching'].includes(spec.type);$('number').value=index+1;$('number').max=questions.length;$('position').textContent=`${index+1} de ${questions.length}`;$('prev').disabled=index===0;$('next').disabled=index===questions.length-1;$('fill').style.width=`${(index+1)/questions.length*100}%`;$('progress').setAttribute('aria-valuenow',index+1);$('progress').setAttribute('aria-valuemax',questions.length);
let controls=choice?`<p class="hint">Selecciona ${spec.answer.length===1?'una respuesta':spec.answer.length+' respuestas'}.</p><div class="options">${spec.options.map(o=>`<label class="option" data-letter="${o.id}"><input type="${spec.answer.length>1?'checkbox':'radio'}" name="answer" value="${o.id}" ${s.selected.includes(o.id)?'checked':''}><span class="letter">${o.id}</span><span>${esc(o.text)}</span></label>`).join('')}</div>`:`<p class="hint">${spec.type==='order'?'Ordena las acciones en los pasos indicados.':spec.type==='matching'?'Asocia cada elemento con su respuesta.':'Completa cada selección siguiendo el orden de la imagen.'} ${drag?'Arrastra una opción a su campo, o utiliza los menús.':''}</p>${drag?`<div class="bank" aria-label="Opciones para arrastrar">${choices(spec.slots[0]).map((t,i)=>`<button type="button" draggable="true" class="tile" data-token="${i}">${esc(t)}</button>`).join('')}</div>`:''}<div class="slots">${spec.slots.map((slot,i)=>`<div class="slot" data-slot="${i}"><label for="slot-${i}">${esc(slot.label)}</label><select id="slot-${i}" data-index="${i}"><option value="">Selecciona…</option>${choices(slot).map(t=>`<option value="${esc(t)}" ${s.selected[i]===t?'selected':''}>${esc(t)}</option>`).join('')}</select><span class="field-result" id="result-${i}"></span></div>`).join('')}</div>`;
$('card').innerHTML=`<div class="meta"><span class="badge">PREGUNTA ${index+1}</span><span class="page">PDF · pregunta ${q.sourceNumber} · pág. ${q.page}</span></div><div class="pdf-tools"><label for="pdf-zoom">Ampliar el enunciado</label><select id="pdf-zoom"><option value="100">Ajustar al ancho</option><option value="150">150 %</option><option value="200">200 %</option><option value="300">300 %</option></select></div><section class="original" aria-label="Enunciado con formato original del PDF">${originalPages(q.questionPages)}</section><details class="text-version"><summary>Leer versión de texto</summary><p class="prompt">${esc(q.prompt)}</p></details><h2 class="answer-title">Tu respuesta</h2>${controls}<div class="actions"><button class="primary" id="verify">Verificar respuesta</button><button id="show">Mostrar respuesta correcta</button><button id="reset">Reintentar</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><details id="solution" hidden><summary>Ver solución original del PDF</summary><div id="solution-pages"></div></details>`;
$('pdf-zoom').onchange=e=>document.querySelectorAll('.original img').forEach(img=>img.style.width=e.target.value+'%');
document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{s.selected=[...document.querySelectorAll('input[name=answer]:checked')].map(e=>e.value);s.mode=null;paint()});
document.querySelectorAll('select[data-index]').forEach(el=>el.onchange=()=>{s.selected[Number(el.dataset.index)]=el.value;s.mode=null;paint()});
document.querySelectorAll('.tile').forEach(el=>el.ondragstart=e=>{e.dataTransfer.setData('text/plain',choices(spec.slots[0])[Number(el.dataset.token)]);e.dataTransfer.effectAllowed='copy'});
document.querySelectorAll('.slot').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');const i=Number(el.dataset.slot),value=e.dataTransfer.getData('text/plain');if(spec.slots[i].choices.includes(value)){s.selected[i]=value;s.mode=null;render()}}});
$('verify').onclick=verify;$('show').onclick=reveal;$('reset').onclick=()=>{states.delete(index);render()};paint();}
function paint(){const q=current(),s=state(),spec=q.interaction,answers=expected(q),f=$('feedback');f.className='feedback';f.textContent='';$('solution').hidden=!s.mode;document.querySelectorAll('.option').forEach(el=>{el.classList.remove('correct','wrong');if(s.mode){if(answers.includes(el.dataset.letter))el.classList.add('correct');else if(s.selected.includes(el.dataset.letter))el.classList.add('wrong')}});document.querySelectorAll('.slot').forEach((el,i)=>{el.classList.remove('correct','wrong');$('result-'+i).textContent='';if(s.mode){const right=grade(q,s.selected)||s.selected[i]===answers[i];el.classList.add(right?'correct':'wrong');$('result-'+i).textContent=(s.mode==='verify'?(right?'✓ Correcto. ':'✗ '):'')+'Respuesta: '+answers[i]}});if(!s.mode)return;const right=grade(q,s.selected);f.classList.add(s.mode==='verify'?(right?'good':'bad'):'good');f.textContent=s.mode==='verify'?(right?'Respuesta correcta. Todas las selecciones coinciden con el PDF.':'Tu respuesta no coincide con la clave del PDF. Revisa los campos indicados.'):'Respuesta correcta según el PDF: '+answers.join(' · ');if(spec.type==='choice')f.textContent+=' Clave: '+answers.join(', ')+'.';$('solution-pages').innerHTML=imagePages(q.answerPages)}
function verify(){const q=current(),s=state(),spec=q.interaction;if(!s.selected.length||(spec.type!=='choice'&&spec.slots.some((_,i)=>!s.selected[i]))){$('feedback').textContent='Completa todos los campos antes de verificar.';return {error:'Respuesta incompleta'}}s.mode='verify';paint();return {correct:grade(q,s.selected),answer:expected(q)}}
function reveal(){state().mode='show';paint();return {answer:expected(current())}}
function navigate(n){if(!Number.isInteger(n)||n<1||n>questions.length)throw Error('Número fuera de rango');index=n-1;render()}
$('prev').onclick=()=>navigate(index);$('next').onclick=()=>navigate(index+2);$('jump').onsubmit=e=>{e.preventDefault();if($('jump').reportValidity())navigate(Number($('number').value))};$('count').textContent=`${questions.length} preguntas · Todas con verificación automática`;render();
</script></body></html>
